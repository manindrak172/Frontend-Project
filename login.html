<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CineBook</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b0b0b;
            color: white;
            display: flex;
            flex-direction: column;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #252525;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #e50914;
            text-decoration: none;
        }

        .logo span {
            color: white;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #ddd;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links .active {
            color: #e50914;
        }

        .login-nav {
            background: #e50914;
            padding: 10px 20px;
            border-radius: 6px;
            color: white !important;
        }

        .login-nav:hover {
            background: #b20710;
        }

        /* ================= LOGIN ================= */

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #151515;
            padding: 40px;
            border-radius: 14px;
            border: 1px solid #292929;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
        }

        .login-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: rgba(229, 9, 20, 0.12);
            border: 1px solid #e50914;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e50914;
            font-size: 28px;
        }

        .login-box h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 14px;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }

        .input-box input {
            width: 100%;
            padding: 14px 45px;
            background: #0e0e0e;
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #e50914;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.2);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        .password-toggle:hover {
            color: white;
        }

        /* ================= OPTIONS ================= */

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #aaa;
        }

        .remember input {
            accent-color: #e50914;
            cursor: pointer;
        }

        .forgot {
            color: #e50914;
            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* ================= BUTTON ================= */

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #e50914;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #b20710;
            transform: translateY(-1px);
        }

        /* ================= DIVIDER ================= */

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #666;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #333;
        }

        /* ================= REGISTER ================= */

        .register-text {
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .register-text a {
            color: #e50914;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        /* ================= FOOTER ================= */

        footer {
            background: #111;
            border-top: 1px solid #252525;
            text-align: center;
            padding: 20px;
            color: #777;
            font-size: 13px;
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #1d1d1d;
            border-left: 4px solid #e50914;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            display: none;
            z-index: 999;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
            }

            .login-box {
                padding: 30px 22px;
            }
        }

        @media (max-width: 400px) {

            .login-box h1 {
                font-size: 25px;
            }

            .form-options {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="index.html" class="logo">
            Cine<span>Book</span>
        </a>

        <ul class="nav-links">
            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="movies.html">Movies</a>
            </li>

            <li>
                <a href="bookings.html">My Bookings</a>
            </li>

            <li>
                <a href="login.html" class="active login-nav">
                    Login
                </a>
            </li>
        </ul>

    </nav>


    <!-- ================= LOGIN SECTION ================= -->

    <main class="login-container">

        <div class="login-box">

            <div class="login-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue booking your movie tickets
            </p>


            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <i
                            class="fa-solid fa-eye password-toggle"
                            id="togglePassword"
                            onclick="togglePassword()">
                        </i>

                    </div>

                </div>


                <!-- Options -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <a href="#" class="forgot"
                       onclick="forgotPassword()">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    &nbsp; Login
                </button>

            </form>


            <div class="divider">
                OR
            </div>


            <!-- Register -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 CineBook.
        All Rights Reserved.

    </footer>


    <!-- ================= TOAST ================= -->

    <div class="toast" id="toast"></div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // Toggle Password
        function togglePassword() {

            const password =
                document.getElementById("password");

            const icon =
                document.getElementById("togglePassword");

            if (password.type === "password") {

                password.type = "text";

                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }


        // Toast
        function showToast(message) {

            const toast =
                document.getElementById("toast");

            toast.textContent = message;

            toast.style.display = "block";

            setTimeout(() => {

                toast.style.display = "none";

            }, 3000);
        }


        // Forgot Password
        function forgotPassword() {

            showToast(
                "Password reset will be available after backend integration."
            );
        }


        // Login
        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value.trim();

                if (email === "" || password === "") {

                    showToast("Please fill all fields.");
                    return;
                }


                /*
                    FRONTEND DEMO LOGIN

                    Later this section will be replaced
                    with PHP + MySQL authentication.
                */

                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("userEmail", email);

                showToast("Login successful!");

                setTimeout(() => {

                    window.location.href = "index.html";

                }, 1000);

            });

    </script>

</body>
</html>
